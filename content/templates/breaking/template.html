<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<style>
  .page { background: var(--black); color: var(--white); }
  /* Foto de fondo (v3, opcional): la foto es la protagonista; la banda
     roja queda encima y el titular va sobre un velo fuerte. Sin image,
     la tarjeta renderiza como antes (retrocompatible). */
  .with-photo.grain::after { display: none; }
  .photo { position: absolute; inset: 0; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover;
    object-position: 50% 30%; display: block; }
  .with-photo .photo::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.30) 0%, rgba(0,0,0,0.45) 35%, rgba(0,0,0,0.72) 60%, rgba(0,0,0,0.88) 85%, rgba(0,0,0,0.92) 100%); }
  /* Banda roja superior con el sello de urgencia. */
  .alert-band { position: absolute; top: 0; left: 0; right: 0; height: 150px;
    background: var(--red); display: flex; align-items: center;
    padding: 0 72px; gap: 24px; }
  .alert-band .icon { width: 72px; height: 72px; color: var(--white); }
  .alert-band .kicker { font-size: 56px; color: var(--white);
    letter-spacing: 0.14em; }
  .alert-band .date { margin-left: auto; font-size: 28px; color: rgba(255,255,255,0.9);
    font-family: var(--font-display); font-weight: 600; letter-spacing: 0.04em; }
  .main { position: absolute; left: 72px; right: 72px; top: 210px; bottom: 230px;
    display: flex; flex-direction: column; justify-content: center; }
  .headline { font-family: var(--font-display); font-weight: 800;
    text-transform: uppercase; font-size: 118px; line-height: 0.98; }
  .body { margin-top: 36px; font-size: 36px; line-height: 1.45; color: #C9C9C9;
    max-width: 880px; }
  .footer { position: absolute; left: 72px; right: 72px; bottom: 0; height: 190px;
    border-top: 1px solid #2A2A2A; display: flex; align-items: center; }
  .footer .brand-logo { height: 130px; width: auto; }
  .footer .meta { margin-left: auto; text-align: right; }
  .footer .source { font-size: 24px; color: var(--gray); max-width: 560px; }
  .footer .web { margin-top: 10px; font-family: var(--font-display); font-weight: 600;
    font-size: 28px; letter-spacing: 0.06em; color: var(--white); }
  /* Variante 4:5: más aire vertical; el titular baja y crece. */
  .format-45 .main { top: 240px; bottom: 260px; }
  .format-45 .headline { font-size: 132px; }
  .format-45 .body { font-size: 38px; }
</style>
</head>
<body>
<div class="page grain{{#if _format45}} format-45{{/if}}{{#if image}} with-photo{{/if}}">
  {{#if image}}<div class="photo"><img src="{{image}}"{{#if image_position}} style="object-position: {{image_position}}"{{/if}} alt=""></div>{{/if}}
  <div class="alert-band">
    <span class="icon">{{icon:siren}}</span>
    <div class="kicker">{{#if kicker}}{{kicker}}{{/if}}{{#if !kicker}}ÚLTIMA HORA{{/if}}</div>
    {{#if date}}<div class="date">{{date}}</div>{{/if}}
  </div>
  <div class="main">
    <div class="headline">{{hl:headline}}</div>
    {{#if body}}<div class="body">{{body}}</div>{{/if}}
  </div>
  <div class="footer">
    {{logo:color}}
    <div class="meta">
      {{#if source}}<div class="source">Fuente: {{source}}</div>{{/if}}
      <div class="web">cubadenuncia.cu</div>
    </div>
  </div>
</div>
</body>
</html>
