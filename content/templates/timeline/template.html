<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<style>
  .page { background: var(--black); color: var(--white); }
  .head { position: absolute; top: 64px; left: 72px; right: 72px; }
  .kicker { font-size: 28px; }
  .title { margin-top: 18px; font-family: var(--font-display); font-weight: 800;
    text-transform: uppercase; font-size: 84px; line-height: 0.98; }
  .subtitle { margin-top: 18px; font-size: 31px; line-height: 1.4; color: #C9C9C9; }
  .events { position: absolute; left: 72px; right: 72px; top: 360px; bottom: 200px;
    display: flex; flex-direction: column; justify-content: space-evenly; }
  /* La línea vertical une los hechos; los puntos rojos marcan cada año. */
  .events::before { content: ''; position: absolute; left: 11px; top: 24px; bottom: 24px;
    width: 4px; background: #2A2A2A; }
  .event { position: relative; padding-left: 64px; }
  .event .dot { position: absolute; left: 0; top: 22px; width: 26px; height: 26px;
    border-radius: 50%; background: var(--red); }
  .event .year { font-family: var(--font-display); font-weight: 800; color: var(--red);
    font-size: 68px; line-height: 1; }
  .event .event-title { margin-top: 8px; font-family: var(--font-display);
    font-weight: 700; text-transform: uppercase; font-size: 40px; line-height: 1.05; }
  .event .event-text { margin-top: 8px; font-size: 29px; line-height: 1.4; color: #C9C9C9; }
  .footer { position: absolute; left: 72px; right: 72px; bottom: 0; height: 170px;
    border-top: 1px solid #2A2A2A; display: flex; align-items: center; }
  .footer .brand-logo { height: 120px; width: auto; }
  .footer .source { margin-left: auto; text-align: right; font-size: 23px;
    color: var(--gray); max-width: 620px; }
</style>
</head>
<body>
<div class="page grain">
  <div class="head">
    <div class="kicker">{{kicker}}</div>
    <div class="title">{{hl:title}}</div>
    {{#if subtitle}}<div class="subtitle">{{subtitle}}</div>{{/if}}
  </div>
  <div class="events">
    {{#each events}}<div class="event">
      <div class="dot"></div>
      <div class="year">{{year}}</div>
      <div class="event-title">{{title}}</div>
      <div class="event-text">{{text}}</div>
    </div>{{/each}}
  </div>
  <div class="footer">
    {{logo:color}}
    {{#if source}}<div class="source">Fuentes: {{source}}</div>{{/if}}
  </div>
</div>
</body>
</html>
