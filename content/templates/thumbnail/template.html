<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<style>
  .page { background: var(--black); color: var(--white); }
  .bg { position: absolute; inset: 0; overflow: hidden; }
  .bg img { width: 1080px; height: 1920px; object-fit: cover; display: block; }
  .bg::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.15) 35%, rgba(0,0,0,0.92) 78%, rgba(0,0,0,0.98) 100%); }
  .top { position: absolute; top: 96px; left: 72px; right: 72px; }
  .kicker { font-size: 34px; }
  .title-block { position: absolute; left: 72px; right: 72px; bottom: 330px; }
  .title-block.with-cutout { right: 540px; }
  .title-block.with-cutout .headline,
  .title-block.with-cutout .accent { font-size: 120px; }
  .cutout { position: absolute; right: 20px; bottom: 270px; width: 500px;
    height: 1000px; display: flex; align-items: flex-end; justify-content: flex-end; }
  .cutout img { max-width: 100%; max-height: 100%; width: auto; height: auto;
    object-fit: contain; display: block; }
  .headline {
    font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
    font-size: 168px; line-height: 0.92; letter-spacing: 0.005em;
  }
  .accent {
    font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
    font-size: 168px; line-height: 0.92; color: var(--red); margin-top: 6px;
  }
  .rule { width: 120px; height: 12px; background: var(--red); margin-bottom: 34px; }
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 270px;
    display: flex; align-items: stretch;
  }
  .logo-chip { width: 330px; flex: none; padding: 28px 0; }
  .logo-chip .brand-logo { height: 214px; }
  .footer .credit { flex: 1; display: flex; flex-direction: column;
    justify-content: center; padding-left: 40px; }
  .footer .credit .name { font-family: var(--font-display); font-weight: 700;
    font-size: 40px; text-transform: uppercase; letter-spacing: 0.04em; }
  .footer .credit .web { font-size: 26px; color: #C9C9C9; margin-top: 8px; }
</style>
</head>
<body>
<div class="page grain{{#if !image}} halftone{{/if}}">
  {{#if image}}<div class="bg"><img src="{{image}}" alt=""></div>{{/if}}
  {{#if cutout}}<div class="cutout"><img src="{{cutout}}" alt=""></div>{{/if}}
  <div class="top">
    <div class="kicker">{{kicker}}</div>
  </div>
  <div class="title-block{{#if cutout}} with-cutout{{/if}}">
    <div class="rule"></div>
    <div class="headline">{{headline}}</div>
    {{#if accent}}<div class="accent">{{accent}}</div>{{/if}}
  </div>
  <div class="footer">
    <div class="logo-chip">{{logo:white}}</div>
    <div class="credit">
      <div class="name">Memorial de la Denuncia</div>
      <div class="web">facebook.com/memorialdenuncia</div>
    </div>
  </div>
</div>
</body>
</html>
