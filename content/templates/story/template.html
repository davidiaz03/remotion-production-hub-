<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<style>
  .page { background: var(--black); color: var(--white); }
  .hero { position: absolute; top: 0; left: 0; width: 1080px; height: 1180px; overflow: hidden; }
  .hero img { width: 1080px; height: 1180px; object-fit: cover; display: block; }
  .hero::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.05) 45%, rgba(0,0,0,0.98) 100%); }
  .content { position: absolute; left: 72px; right: 72px; top: 1080px; bottom: 320px; }
  .content.no-hero { top: 150px; display: flex; flex-direction: column;
    justify-content: center; }
  .kicker { font-size: 32px; }
  .headline {
    font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
    font-size: 128px; line-height: 0.95; margin-top: 26px;
  }
  .body { margin-top: 30px; font-size: 38px; line-height: 1.45; color: #D8D8D8; }
  .cta {
    display: inline-block; margin-top: 36px; background: var(--red); color: var(--white);
    font-family: var(--font-display); font-weight: 700; font-size: 36px;
    text-transform: uppercase; letter-spacing: 0.08em; padding: 20px 36px;
  }
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 280px;
    display: flex; align-items: stretch;
  }
  .logo-chip { width: 340px; flex: none; padding: 30px 0; }
  .logo-chip .brand-logo { height: 220px; }
  .footer .credit { flex: 1; display: flex; flex-direction: column;
    justify-content: center; padding-left: 40px; border-top: 1px solid #2A2A2A; }
  .footer .credit .web { font-family: var(--font-display); font-weight: 600;
    font-size: 34px; letter-spacing: 0.06em; }
  .footer .credit .addr { font-size: 24px; color: var(--gray); margin-top: 10px; }
</style>
</head>
<body>
<div class="page grain{{#if !image}} halftone{{/if}}">
  {{#if image}}<div class="hero"><img src="{{image}}" alt=""></div>{{/if}}
  <div class="content{{#if !image}} no-hero{{/if}}">
    <div class="kicker">{{kicker}}</div>
    <div class="headline">{{headline}}</div>
    <div class="body">{{body}}</div>
    {{#if cta}}<div class="cta">{{cta}}</div>{{/if}}
  </div>
  <div class="footer">
    <div class="logo-chip">{{logo:white}}</div>
    <div class="credit">
      <div class="web">cubadenuncia.cu</div>
      <div class="addr">Memorial de la Denuncia · Miramar, La Habana</div>
    </div>
  </div>
</div>
</body>
</html>
