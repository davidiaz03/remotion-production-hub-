<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<style>
  .page { background: var(--paper); color: var(--black); }
  .head { position: absolute; top: 64px; left: 72px; right: 72px; }
  .kicker { font-size: 28px; }
  .title { font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
    font-size: 84px; line-height: 0.98; margin-top: 18px; }
  .subtitle { margin-top: 18px; font-size: 32px; line-height: 1.4; color: #444; }
  .middle { position: absolute; left: 72px; right: 72px; top: 370px; bottom: 230px; }
  .stat { display: flex; align-items: baseline; gap: 28px; padding: 28px 0;
    border-bottom: 1px solid #D8D2C8; }
  .stat .value { font-family: var(--font-display); font-weight: 800; color: var(--red);
    font-size: 112px; line-height: 1; flex: none; width: 360px; }
  .stat .label { font-family: var(--font-display); font-weight: 700; font-size: 40px;
    text-transform: uppercase; line-height: 1.1; }
  .stat .sub { font-size: 26px; color: #666; margin-top: 6px; font-family: var(--font-body); }
  .items { margin-top: 36px; }
  .item { display: flex; gap: 20px; margin-bottom: 20px; align-items: baseline; }
  .item .mark { width: 16px; height: 16px; background: var(--red); flex: none;
    transform: translateY(-2px); }
  .item .text { font-size: 30px; line-height: 1.4; color: #222; }
  .item .text b { font-weight: 700; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 190px;
    background: var(--black); display: flex; align-items: center; padding: 0 72px; }
  .foot .brand-logo { height: 150px; width: auto; }
  .foot .source { margin-left: auto; text-align: right; max-width: 640px; }
  .foot .source .label { font-size: 22px; color: var(--gray); text-transform: uppercase;
    letter-spacing: 0.1em; font-family: var(--font-display); font-weight: 600; }
  .foot .source .text { font-size: 24px; color: #C9C9C9; margin-top: 6px; line-height: 1.35; }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    {{#if kicker}}<div class="kicker">{{kicker}}</div>{{/if}}
    <div class="title">{{title}}</div>
    {{#if subtitle}}<div class="subtitle">{{subtitle}}</div>{{/if}}
  </div>
  <div class="middle">
  <div class="stats">
    {{#each stats}}<div class="stat">
      <div class="value">{{value}}</div>
      <div><div class="label">{{label}}</div>{{#if sub}}<div class="sub">{{sub}}</div>{{/if}}</div>
    </div>{{/each}}
  </div>
  {{#if items}}<div class="items">
    {{#each items}}<div class="item"><div class="mark"></div><div class="text">{{text|raw}}</div></div>{{/each}}
  </div>{{/if}}
  </div>
  <div class="foot">
    {{logo:color}}
    <div class="source">
      <div class="label">Fuente</div>
      <div class="text">{{source}}</div>
    </div>
  </div>
</div>
</body>
</html>
