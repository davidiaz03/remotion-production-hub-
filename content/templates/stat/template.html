<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<style>
  .page { background: var(--black); color: var(--white); }
  /* Foto de fondo (v3, opcional): velo plano fuerte para que la cifra
     gigante en rojo siga siendo legible. Sin image, la tarjeta
     renderiza como antes (retrocompatible). */
  .with-photo.grain::after { display: none; }
  .photo { position: absolute; inset: 0; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover;
    object-position: 50% 50%; display: block; }
  .with-photo .photo::after { content: ''; position: absolute; inset: 0;
    background: rgba(0,0,0,0.82); }
  /* Velo viñeta (v4, veil: "vignette"): la foto respira en los bordes y
     el centro queda oscuro para la cifra y el texto. El velo plano
     (0.82) sigue siendo el valor por defecto (retrocompatible): sin
     veil, la tarjeta renderiza como en la v3. */
  .veil-vignette .photo::after { background:
    radial-gradient(ellipse 84% 70% at 50% 52%, rgba(0,0,0,0.86) 0%, rgba(0,0,0,0.64) 52%, rgba(0,0,0,0) 76%),
    linear-gradient(to bottom, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.58) 18%, rgba(0,0,0,0.24) 36%, rgba(0,0,0,0.24) 60%, rgba(0,0,0,0.52) 80%, rgba(0,0,0,0.84) 100%); }
  .veil-vignette .photo img { filter: brightness(1.12) saturate(1.06); }
  .head { position: absolute; top: 64px; left: 72px; right: 72px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #2A2A2A; padding-bottom: 22px; }
  .kicker { font-size: 28px; }
  .head .brand-logo { height: 120px; width: auto; }
  .center { position: absolute; left: 72px; right: 72px; top: 220px; bottom: 240px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; }
  /* La cifra protagonista: gigante, en rojo de marca. Máx. ~6 caracteres. */
  .value { font-family: var(--font-display); font-weight: 800; color: var(--red);
    font-size: 380px; line-height: 0.9; letter-spacing: -0.01em; }
  .label { margin-top: 24px; font-family: var(--font-display); font-weight: 700;
    text-transform: uppercase; font-size: 52px; line-height: 1.1; max-width: 860px; }
  .context { margin-top: 26px; font-size: 32px; line-height: 1.45; color: #C9C9C9;
    max-width: 820px; }
  .footer { position: absolute; left: 72px; right: 72px; bottom: 0; height: 170px;
    border-top: 1px solid #2A2A2A; display: flex; align-items: center;
    justify-content: space-between; }
  .footer .source { font-size: 24px; color: var(--gray); max-width: 640px; }
  .footer .web { font-family: var(--font-display); font-weight: 600; font-size: 28px;
    letter-spacing: 0.06em; color: var(--white); }
</style>
</head>
<body>
<div class="page grain{{#if image}} with-photo{{/if}}{{#if veil}} veil-{{veil}}{{/if}}">
  {{#if image}}<div class="photo"><img src="{{image}}"{{#if image_position}} style="object-position: {{image_position}}"{{/if}} alt=""></div>{{/if}}
  <div class="head">
    <div class="kicker">{{kicker}}</div>
    {{logo:color}}
  </div>
  <div class="center">
    <div class="value">{{value}}</div>
    <div class="label">{{label}}</div>
    {{#if context}}<div class="context">{{context}}</div>{{/if}}
  </div>
  <div class="footer">
    {{#if source}}<div class="source">Fuente: {{source}}</div>{{/if}}
    <div class="web">cubadenuncia.cu</div>
  </div>
</div>
</body>
</html>
