<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/base.css">
<style>
  .page { background: var(--black); color: var(--white); }
  .hero { position: absolute; top: 0; left: 0; width: 1080px; height: 420px; overflow: hidden; }
  .hero img { width: 1080px; height: 420px; object-fit: cover; display: block; }
  .hero::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,0) 55%, rgba(0,0,0,0.9) 100%); }
  .content { position: absolute; left: 72px; right: 72px; top: 72px; bottom: 230px;
    display: flex; flex-direction: column; justify-content: center; }
  .content.with-hero { top: 460px; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; }
  .kicker { font-size: 30px; }
  .date { font-family: var(--font-body); font-size: 26px; color: var(--gray); }
  .head-row { display: flex; margin-top: 28px; }
  .headline {
    font-family: var(--font-display); font-weight: 800; text-transform: uppercase;
    font-size: 108px; line-height: 0.95; letter-spacing: 0.01em; margin-left: 28px;
  }
  .body { margin-top: 34px; font-size: 34px; line-height: 1.45; color: #C9C9C9; font-weight: 400; }
  .cta { margin-top: 30px; font-family: var(--font-display); font-weight: 700;
    font-size: 34px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--red); }
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 190px;
    border-top: 1px solid #2A2A2A; display: flex; align-items: center;
    padding: 0 72px;
  }
  .footer .brand-logo { height: 150px; width: auto; }
  .footer .credit { margin-left: auto; text-align: right; }
  .footer .credit .web { font-family: var(--font-display); font-weight: 600;
    font-size: 30px; letter-spacing: 0.06em; color: var(--white); }
  .footer .credit .addr { font-size: 22px; color: var(--gray); margin-top: 8px; }
</style>
</head>
<body>
<div class="page grain">
  {{#if image}}<div class="hero"><img src="{{image}}" alt=""></div>{{/if}}
  <div class="content{{#if image}} with-hero{{/if}}">
    <div class="meta">
      <div class="kicker">{{kicker}}</div>
      {{#if date}}<div class="date">{{date}}</div>{{/if}}
    </div>
    <div class="head-row">
      <div class="red-bar"></div>
      <div class="headline">{{headline}}</div>
    </div>
    <div class="body">{{body}}</div>
    {{#if cta}}<div class="cta">{{cta}}</div>{{/if}}
  </div>
  <div class="footer">
    {{logo:color}}
    <div class="credit">
      <div class="web">cubadenuncia.cu</div>
      <div class="addr">Ave 5ta Nro. 1402, Miramar, La Habana</div>
    </div>
  </div>
</div>
</body>
</html>
