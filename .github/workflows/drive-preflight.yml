name: 03 - Drive preflight (NO RENDER)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
      - name: Prepare credential without logging tokens
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          test -n "$RCLONE_CONFIG_B64" || { echo "Missing secret RCLONE_CONFIG_B64; see docs/DRIVE.md"; exit 1; }
          node scripts/rclone-env.mjs
      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      - name: Check Drive read only
        run: node scripts/drive-preflight.mjs
      - name: Remove temporary credential
        if: ${{ always() }}
        run: rm -f "${RUNNER_TEMP}/remotion-rclone.conf"
